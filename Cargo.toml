[package]
name = "pneuma"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[profile.test]
debug = true

[features]
default = []
tokio_compat = ["tokio"]
unsafe_work_stealing = []
net = ["dns-protocol", "memchr", "mio"]
io = ["net", "fs"]
fs = ["io-uring"]
sync = []

[dependencies]
crossbeam-deque = "0.8.5"
fastrand = "2.1.0"
libc = "0.2.151"
thread_local = "1.1.8"
tokio = { version = "1.37.0", features = ["rt"], optional = true }
mio = { version = "0.8.10", features = [
    "os-poll",
    "net",
    "os-ext",
], optional = true }

# required by net
dns-protocol = { version = "0.1.1", optional = true }
memchr = { version = "2.7.2", optional = true }
cfg-if = "1.0.0"
crossbeam-channel = "0.5.13"


[target.'cfg(target_os="linux")'.dependencies]
io-uring = { version = "0.6.2", optional = true }


[dev-dependencies]
pneuma = { path = ".", features = ["io", "unsafe_work_stealing"] }
rand = "0.8.5"

[build-dependencies]
cfg_aliases = "0.1.0"
