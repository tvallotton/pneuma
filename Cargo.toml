[package]
name = "pneuma"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[features]
default-features = []
full = ["io"]
io = []
unsafe_work_stealing = []

[dependencies]
libc = "0.2.151"
mio = { version = "0.8.10", features = ["os-poll"] }
thread_local = "1.1.8"


[target.'cfg(target_os="linux")'.dependencies]
io-uring = "0.6.2"

[dev-dependencies]
pneuma = { path = ".", features = ["full", "unsafe_work_stealing"] }
